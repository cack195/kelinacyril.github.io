name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Public Assets
        run: |
          mkdir -p public/data
          # Ensure public/data has portfolio.json and name.png
          cp data/portfolio.json public/data/portfolio.json
          cp data/name.png public/data/name.png
          # Remove admin credentials and ensure relative paths in public static json
          node -e "const fs = require('fs'); const file = 'public/data/portfolio.json'; if (fs.existsSync(file)) { let text = fs.readFileSync(file, 'utf8').replace(/\"\/uploads\//g, '\"uploads/'); const d = JSON.parse(text); delete d.admin; fs.writeFileSync(file, JSON.stringify(d, null, 2)); }"
          touch public/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
